[package]
name = "formalboot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The FormalOS boot screen: the logo, a progress bar and the live tree of systemd jobs, drawn through KMS"
repository = "https://github.com/FormalStudio/formalboot"

[dependencies]
fontdue = "0.9"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.15"
libc = "0.2"
signal-hook = "0.4"
# The version rustbus takes its socket address type from.
nix = { version = "0.26", default-features = false, features = ["socket"] }
rustbus = "0.19"

[profile.release]
lto = "thin"
strip = true
